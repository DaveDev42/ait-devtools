name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm build

      # Footprint invariant (#818): this package is a devDependency whose
      # contribution to a production mini-app bundle must be zero bytes. Also
      # asserts the moved debug surface has not crept back into dist/. Builds
      # the fixture in release + forced modes and greps
      # (see scripts/check-devtools-footprint-absent.sh).
      #
      # Replaces the four guards the split removed with the surfaces they
      # watched: check:mcp-react-free, check:test-runner-dist,
      # check:debug-surface-absent and check:dashboard-html-fresh all guarded
      # code that now lives in @ait-co/debugger / @ait-co/debug-console.
      - run: pnpm check:footprint-absent

      # Alias-presence guard: the dual-line typecheck verifies the mock against
      # both 3.0.1 GA (bare devDep) and the 2.x stable line (web-framework-2x
      # alias). If the alias silently disappears or drifts off the expected
      # version, tsconfig.2x.json would skip silently — fail fast instead of
      # green-lying. The alias is pinned to 2.10.8 exact (latest verified-clean
      # 2.x as of 2026-07): 2.10.1 had the upstream CodegenTypes type regression
      # (web-bridge imported an unbuilt raw .ts subpath from native-modules),
      # fixed upstream by 2.10.2 (confirmed clean 2.10.2 through 2.10.8). The
      # guard rejects any drift off the pinned version — exact pin, not a range,
      # so every alias bump goes through a PR that re-verifies tsc cleanliness.
      # Bump this expected version in lockstep whenever the alias is advanced.
      - run: 'node -e "const p=require(''@apps-in-toss/web-framework-2x/package.json''); if(!/^2\.10\.8$/.test(p.version)){console.error(''2x alias not 2.10.8: ''+p.version);process.exit(1)}"'

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm qa:fidelity --runner=mock

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Cache Playwright browsers keyed on the resolved @playwright/test version
      # so version bumps invalidate the cache automatically.
      - id: playwright-version
        run: |
          version=$(node -e 'const j=JSON.parse(require("child_process").execSync("pnpm list @playwright/test --depth=0 --json").toString());console.log(j[0].devDependencies["@playwright/test"].version)')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # webServer in playwright.config.ts builds devtools (`pnpm build`) and
      # the e2e/fixture/ Vite app, then serves the preview on :4173.
      - run: pnpm test:e2e

      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
          if-no-files-found: ignore
